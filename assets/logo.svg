<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PHAROS">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B1A" stop-opacity=".85"/>
      <stop offset="1" stop-color="#FF6B1A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="b2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFA23C" stop-opacity=".7"/>
      <stop offset="1" stop-color="#FFA23C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="c">
      <stop offset="0" stop-color="#FFF3E4"/>
      <stop offset=".55" stop-color="#FFA23C"/>
      <stop offset="1" stop-color="#FF6B1A"/>
    </radialGradient>
  </defs>
  <!-- beams -->
  <path d="M32 32 L64 14 L64 50 Z" fill="url(#b)"/>
  <path d="M32 32 L0 16 L0 48 Z" fill="url(#b2)"/>
  <!-- iris ring -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#7FE3FF" stroke-opacity=".55" stroke-width="1.6"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#7FE3FF" stroke-opacity=".2" stroke-width="1"
          stroke-dasharray="3 6"/>
  <!-- core -->
  <circle cx="32" cy="32" r="8" fill="url(#c)"/>
  <circle cx="32" cy="32" r="3.2" fill="#120702" fill-opacity=".18"/>
</svg>
